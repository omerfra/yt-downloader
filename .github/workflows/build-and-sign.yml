name: Build & Sign Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0

permissions:
  contents: write       # Needed to create GitHub releases
  id-token: write       # Needed for SignPath origin verification
  actions: read         # Needed for SignPath to read workflow info

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyinstaller

      - name: Download yt-dlp
        run: |
          New-Item -ItemType Directory -Force tools
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile "tools/yt-dlp.exe"

      - name: Download ffmpeg
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "tools/ffmpeg.zip"
          Expand-Archive -Path "tools/ffmpeg.zip" -DestinationPath "tools/ffmpeg_temp"
          $binDir = Get-ChildItem -Path "tools/ffmpeg_temp" -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $binDir.FullName "tools/ffmpeg.exe"
          $probeDir = Get-ChildItem -Path "tools/ffmpeg_temp" -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          Copy-Item $probeDir.FullName "tools/ffprobe.exe"
          Remove-Item -Recurse -Force "tools/ffmpeg_temp", "tools/ffmpeg.zip"

      - name: Build exe with PyInstaller
        run: python build_exe.py

      - name: Upload unsigned artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: dist/YouTube Downloader.exe

  sign:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download unsigned artifact
        uses: actions/download-artifact@v4
        with:
          name: unsigned-exe
          path: artifacts/

      - name: Submit signing request to SignPath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: yt-downloader
          signing-policy-slug: release-signing
          artifact-configuration-slug: exe-artifact
          github-artifact-id: unsigned-exe
          wait-for-completion: true
          output-artifact-directory: artifacts/signed/

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: signed-exe
          path: artifacts/signed/

  release:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - name: Download signed artifact
        uses: actions/download-artifact@v4
        with:
          name: signed-exe
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/YouTube Downloader.exe
          generate_release_notes: true
